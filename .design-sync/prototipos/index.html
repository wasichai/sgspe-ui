        <!-- los dos tokens que propone docs/ux/redesign/03 §2.2, simulados aquí hasta que lleguen a tokens.css -->

            :root {
                --sg-surface-raised: #ffffff;
                --sg-border-control: var(--sg-border-strong);
            }
            :root[data-theme='dark'] {
                --sg-surface-raised: #1d2420;

            .bg-sg-surface-raised {

            input:not([type='checkbox']):not([type='radio']),
