name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # keeps one release pr open from the conventional commits on main. merging it bumps package.json, writes
      # CHANGELOG.md, tags vX.Y.Z and creates the github release.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # a pr opened with GITHUB_TOKEN does not trigger other workflows, so ci.yml and commits.yml would never run
          # on the release pr; a PAT makes them run
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
