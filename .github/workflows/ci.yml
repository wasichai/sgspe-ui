name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    # a hung yarn install or vite build must not burn the default 6 h
    timeout-minutes: 20
    # @wasichai/* are private packages of wasichai-ui: the workflow token cannot read them, a read:packages PAT can
    # (repo secret PACKAGES_TOKEN). job level, not only on the install step:
    # setup-node writes an .npmrc that reads ${NODE_AUTH_TOKEN} and, with cache: yarn, runs yarn right away
    env:
      NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # spec F6 §3.3: src/portal/mapa/paleta.json es copia de model/styles/palette.json de sgspe (repositorio público); la
      # prueba de la paleta compara los bytes con este checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wasichai/sgspe
          ref: main
          path: .sgspe
          sparse-checkout: model/styles
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: yarn
          registry-url: https://npm.pkg.github.com
          scope: '@wasichai'
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
        env:
          SGSPE_REPO: .sgspe
          SGSPE_PALETA_OBLIGATORIA: 'true'
      - run: yarn build
      # las pruebas extremo a extremo de F2 (ASM-066): chromium de Playwright sobre vite preview, con la API simulada
      - run: npx playwright install --with-deps chromium
      - run: yarn e2e
        env:
          CI: 'true'
      # si una prueba falla, el reporte y las trazas (test-results/, trace: retain-on-failure) quedan para abrirlos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
